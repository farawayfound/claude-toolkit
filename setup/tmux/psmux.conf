# claude-toolkit psmux.conf (psmux is tmux for Windows: winget install marlocarlo.psmux). tmux.cmd writes it to ~/.psmux.conf when
# none exists, otherwise it appends `source-file <this file>` to yours. psmux also reads ~/.tmux.conf. Reload inside psmux: prefix r.
# default-shell is written by tmux.cmd (pwsh 7), because psmux's Claude Code integration needs PowerShell 7 in the panes.
set -g mouse on                                   # click a teammate's pane to talk to it; wheel scrolls its history
set -g history-limit 100000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g pane-border-status top                     # the border shows the pane title: Claude Code sets it to the teammate's name
set -g pane-border-format " #{pane_index} #{pane_title} "
set -g status-interval 5
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " %H:%M "
set -g claude-code-fix-tty on                     # psmux: TMUX, the teams switch and --teammate-mode tmux inside every pane
bind r source-file ~/.psmux.conf \; display "psmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
