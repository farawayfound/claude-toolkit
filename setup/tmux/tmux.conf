# claude-toolkit tmux.conf (macOS, Linux, WSL; Windows uses psmux.conf): agent-team panes readable at a glance. setup/tmux.sh copies it to ~/.tmux.conf when none exists,
# otherwise it appends `source-file <this file>` to yours. Reload inside tmux: prefix r (prefix is Ctrl+b).
set -g mouse on                                   # click a teammate's pane to talk to it; wheel scrolls its history
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g pane-border-status top                     # the border shows the pane title, which Claude Code sets to the teammate's name
set -g pane-border-format " #{pane_index} #{pane_title} "
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour240"
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null) | %H:%M "
set -g status-right-length 80
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# copy to the system clipboard: Windows (WSL) or macOS
if-shell 'command -v clip.exe >/dev/null 2>&1' 'bind -T copy-mode y send -X copy-pipe-and-cancel "clip.exe"; bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode y send -X copy-pipe-and-cancel "pbcopy"; bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
